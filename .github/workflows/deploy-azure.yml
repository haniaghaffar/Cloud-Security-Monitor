name: Deploy Frontend to Azure

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production frontend
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_AUTH_CLIENT_ID: ${{ vars.VITE_AUTH_CLIENT_ID }}
      VITE_AUTH_TENANT_ID: ${{ vars.VITE_AUTH_TENANT_ID }}
      VITE_AUTH_API_SCOPE: ${{ vars.VITE_AUTH_API_SCOPE }}
      VITE_AUTH_REDIRECT_URI: ${{ vars.VITE_AUTH_REDIRECT_URI }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          required_variables=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_STATIC_WEB_APP_NAME
            VITE_API_BASE_URL
            VITE_AUTH_CLIENT_ID
            VITE_AUTH_TENANT_ID
            VITE_AUTH_API_SCOPE
          )
          for name in "${required_variables[@]}"; do
            if [[ -z "${!name}" || "${!name}" == *"<"* ]]; then
              echo "::error::$name must be configured as a production environment variable."
              exit 1
            fi
          done
          if [[ "$VITE_API_BASE_URL" != https://* ]]; then
            echo "::error::VITE_API_BASE_URL must be the actual HTTPS backend URL."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run project tests
        run: node qa_test.mjs

      - name: Build production bundle
        run: npm run build

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Static Web Apps Azure CLI extension
        run: az extension add --name staticwebapp --yes

      - name: Get Static Web Apps deployment token
        id: deployment-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --name "$AZURE_STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey \
            --output tsv)"
          if [[ -z "$token" ]]; then
            echo "::error::Azure returned an empty Static Web Apps deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.token }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
